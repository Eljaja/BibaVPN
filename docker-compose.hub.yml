# One-liner quick start using prebuilt images from Docker Hub.
#
#   docker compose -f docker-compose.hub.yml up -d
#
# This variant does NOT build anything locally — it pulls:
#   - eljaja/bibavpn-server
#   - eljaja/bibavpn-client
#
# Exposes on the host (loopback-only — not reachable from the network):
#   SOCKS5        127.0.0.1:11080
#   HTTP CONNECT  127.0.0.1:11880
#
# BIBA_VPN_TOKEN and BIBA_VPN_PSK have no defaults — compose refuses to start
# until you set them (both server and client must use the same values):
#   BIBA_VPN_TOKEN=... BIBA_VPN_PSK=... docker compose -f docker-compose.hub.yml up -d

services:
  biba-server:
    image: eljaja/bibavpn-server:latest
    pull_policy: always
    restart: unless-stopped
    command:
      - --listen
      - 0.0.0.0:8443
      - --self-signed-san
      - biba-server
      - --token
      - ${BIBA_VPN_TOKEN:?set BIBA_VPN_TOKEN}
      - --psk
      - ${BIBA_VPN_PSK:?set BIBA_VPN_PSK}
      - --decoy-max
      - "24"
      - --max-pad
      - "64"
      - --max-ws-binary
      - "1400"
      - --ws-ping-secs
      - "25"
    ports:
      - "8443:8443"
    networks:
      - bibanet

  biba-client:
    image: eljaja/bibavpn-client:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - biba-server
    command:
      - --server
      - biba-server:8443
      - --sni
      - biba-server
      - --token
      - ${BIBA_VPN_TOKEN:?set BIBA_VPN_TOKEN}
      - --psk
      - ${BIBA_VPN_PSK:?set BIBA_VPN_PSK}
      - --insecure
      - --socks5
      - 0.0.0.0:11080
      - --http-proxy
      - 0.0.0.0:18080
      - --decoy-max
      - "24"
      - --max-pad
      - "64"
      - --max-ws-binary
      - "1400"
      - --ws-ping-secs
      - "25"
      - --early-ws-frames
      - "1"
    ports:
      - "127.0.0.1:11080:11080"
      - "127.0.0.1:11880:18080"
    networks:
      - bibanet

networks:
  bibanet:
