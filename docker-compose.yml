# Local lab: bash start.sh   (writes .biba-start.env and starts server with invite)
# Or: export BIBA_TOKEN BIBA_PSK BIBA_INVITE_PASSPHRASE && docker compose --env-file … up
# Client: SOCKS5 localhost:11080, HTTP CONNECT localhost:11880 → biba-server:8443 (PSK + decoy)
services:
  biba-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    command:
      - --listen
      - 0.0.0.0:8443
      - --self-signed-san
      - biba-server
      - --token
      - "${BIBA_TOKEN:?run bash start.sh or set BIBA_TOKEN}"
      - --psk
      - "${BIBA_PSK:?run bash start.sh or set BIBA_PSK}"
      - --decoy-max
      - "24"
      - --max-pad
      - "64"
      - --max-ws-binary
      - "${BIBA_MAX_WS_BINARY:-262144}"
      - --ws-ping-secs
      - "25"
      - --print-invite-uri
      - --invite-passphrase
      - "${BIBA_INVITE_PASSPHRASE:?run bash start.sh or set BIBA_INVITE_PASSPHRASE}"
      - --invite-public
      - "${BIBA_INVITE_PUBLIC:-127.0.0.1:8443}"
      - --invite-sni
      - "${BIBA_INVITE_SNI:-biba-server}"
    ports:
      - "8443:8443"
    networks:
      - bibanet

  biba-client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    depends_on:
      - biba-server
    command:
      - --server
      - biba-server:8443
      - --sni
      - biba-server
      - --token
      - docker-compose-biba
      - --insecure
      - --socks5
      - 0.0.0.0:11080
      - --http-proxy
      - 0.0.0.0:18080
      - --psk
      - ComposePSK_ChangeMe
      - --decoy-max
      - "24"
      - --max-pad
      - "64"
      - --max-ws-binary
      - "1400"
      - --ws-ping-secs
      - "25"
      - --early-ws-frames
      - "1"
    ports:
      - "11080:11080"
      - "11880:18080"
    networks:
      - bibanet

networks:
  bibanet:
