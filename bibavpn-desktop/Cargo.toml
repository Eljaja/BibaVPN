[package]
name = "bibavpn-desktop"
version.workspace = true
edition.workspace = true
description = "BibaVPN desktop: local proxy, system proxy toggle, tray icon"

[build-dependencies]
winresource = "0.1"
ico = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }

[dependencies]
bibavpn = { path = "../bibavpn" }
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wgpu",
] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "sync"] }
tray-icon = "0.19"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = ["Win32_Networking_WinInet"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
