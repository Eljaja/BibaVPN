[package]
name = "bibavpn-desktop"
version.workspace = true
edition.workspace = true
description = "BibaVPN desktop (Tauri): local proxy, system proxy, tray"

[features]
# Without `tauri/custom-protocol` Tauri stays in “dev” mode and loads `devUrl` (localhost:5173).
# Default on so `cargo build --release` serves `frontendDist` via the asset protocol.
# For Vite HMR: `cargo run --no-default-features` and `npm run dev` in `ui/`.
default = ["embed-ui"]
embed-ui = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
bibavpn = { path = "../../bibavpn" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "sync"] }
anyhow = "1"
dirs = "5"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sys-locale = "0.3.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = ["Win32_Networking_WinInet"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
