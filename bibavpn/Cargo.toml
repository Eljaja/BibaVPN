[package]
name = "bibavpn"
version.workspace = true
edition.workspace = true
description = "WSS tunnel with frame padding (Amnezia-inspired) and browser-like handshake (naive/v2ray-friendly)."

[[bin]]
name = "bibavpn-server"
path = "src/bin/server.rs"

[[bin]]
name = "bibavpn-client"
path = "src/bin/client.rs"

[[bin]]
name = "bibavpn-mint-invite"
path = "src/bin/mint_invite.rs"

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.22"
biba = { path = "../biba", features = ["rustls"] }
blake3 = "1.5"
bytes = "1"
chacha20poly1305 = { version = "0.10", features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
subtle = "2"
futures-util = "0.3"
http = "1"
httparse = "1"
rand = "0.8"
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
tokio = { version = "1.43", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "io-util",
    "sync",
    "time",
    "fs",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = [
    "handshake",
    "connect",
    "rustls-native-certs",
    "rustls-tls-webpki-roots",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hex = "0.4"
boring = { version = "5.1.0", optional = true }
tokio-boring = { version = "5.0.0", optional = true }
foreign-types = { version = "0.5", optional = true }

[features]
default = []
# BoringSSL + tokio (optional build; `cmake` + `nasm` on Windows may be required for boring-sys).
boring-tls = ["dep:boring", "dep:tokio-boring", "dep:foreign-types"]
