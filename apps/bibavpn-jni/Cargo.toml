[package]
name = "bibavpn-jni"
version.workspace = true
edition.workspace = true
description = "JNI bridge: local SOCKS5 front for BibaVPN on Android"

[lib]
name = "bibavpn_jni"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
bibavpn = { path = "../../bibavpn" }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.43", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "io-util",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
log = "0.4"
