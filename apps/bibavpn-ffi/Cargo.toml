[package]
name = "bibavpn-ffi"
version.workspace = true
edition.workspace = true
description = "C ABI static library for BibaVPN on iOS Packet Tunnel (SOCKS front-end)"

[lib]
name = "bibavpn_ffi"
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1"
bibavpn = { path = "../../bibavpn" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.43", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "io-util",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
