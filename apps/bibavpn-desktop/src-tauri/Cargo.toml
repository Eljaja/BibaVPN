[package]
name = "bibavpn-desktop"
version.workspace = true
edition.workspace = true
description = "BibaVPN desktop (Tauri): local proxy, system proxy, tray"

[lib]
name = "bibavpn_desktop"
# `staticlib` вместе с `cdylib` на некоторых toolchain (rustc 1.94 + json diagnostics) даёт ICE при линковке; для Tauri Android достаточно lib + cdylib.
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"

[features]
# Without `tauri/custom-protocol` Tauri stays in “dev” mode and loads `devUrl` (localhost:5173).
# Default on so `cargo build --release` serves `frontendDist` via the asset protocol.
# `boring-tls` is off by default so Android (Tauri mobile) links without boring-sys; desktop enables it in tauri.conf.json `build.features`.
# For Vite HMR: `cargo run --no-default-features` and `npm run dev` in `ui/`.
default = ["embed-ui"]
embed-ui = ["tauri/custom-protocol"]
# Forward to bibavpn; requires cmake/nasm on some Windows hosts for boring-sys.
boring-tls = ["bibavpn/boring-tls"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
urlencoding = "2"
bibavpn = { path = "../../../bibavpn" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "sync"] }
anyhow = "1"
dirs = "5"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sys-locale = "0.3.2"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Networking_WinInet",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
