version: 2
updates:
  # Root Cargo workspace: bibavpn, biba, apps/bibavpn-jni, apps/bibavpn-ffi,
  # apps/bibavpn-desktop/src-tauri.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  # Tauri desktop shell (package.json alongside src-tauri).
  - package-ecosystem: "npm"
    directory: "/apps/bibavpn-desktop"
    schedule:
      interval: "weekly"

  # Desktop frontend UI.
  - package-ecosystem: "npm"
    directory: "/apps/bibavpn-desktop/ui"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
