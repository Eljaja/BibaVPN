# Manual: Actions → Desktop macOS → Run workflow. Also runs on push to main when
# core VPN or desktop app paths change. Not on pull_request — tests live in test.yml.
name: Desktop macOS

run-name: Desktop macOS · ${{ github.event_name == 'workflow_dispatch' && 'manual' || github.ref_name }}

on:
  workflow_dispatch:

  workflow_call:
    secrets:
      BIBA_BYPASS_DOMAINS_URL:
        required: false

  push:
    branches: [main, master]
    paths:
      - "bibavpn/**"
      - "!bibavpn/**/*.md"
      - "biba/**"
      - "!biba/**/*.md"
      - "apps/bibavpn-desktop/**"
      - "!apps/bibavpn-desktop/**/*.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/desktop-macos.yml"
      - ".github/scripts/ci-fetch-bypass-domains.sh"

concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BIBA_BYPASS_DOMAINS_URL: ${{ secrets.BIBA_BYPASS_DOMAINS_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/bibavpn-desktop/ui/package-lock.json

      - name: Install UI deps & build frontend
        working-directory: apps/bibavpn-desktop/ui
        run: npm install --no-audit --no-fund && npm run build

      - name: Fetch split-tunnel list for compile-time embed
        env:
          BIBA_BYPASS_DOMAINS_REQUIRED: ${{ github.event_name == 'workflow_call' && '1' || '0' }}
        run: bash .github/scripts/ci-fetch-bypass-domains.sh

      # `tauri build` (not a bare `cargo build`) is what consumes `bundle.icon`
      # from tauri.conf.json: it writes Contents/Resources/icon.icns and the
      # matching CFBundleIconFile into Info.plist. The previous hand-rolled
      # BibaVPN.app created an empty Resources/ and a plist with no
      # CFBundleIconFile, so the Dock and Finder fell back to the generic icon —
      # only the tray icon worked, because that one is include_image!'d into the
      # executable. The hand-written plist had also drifted to version 0.1.0
      # while tauri.conf.json said 0.2.0; the bundler keeps them in sync.
      - name: Build bundles (.app + DMG)
        working-directory: apps/bibavpn-desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles app,dmg

      - name: Stage DMG
        run: |
          set -euo pipefail
          cp target/release/bundle/dmg/*.dmg BibaVPN-macos-aarch64.dmg
          ls -la BibaVPN-macos-aarch64.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: BibaVPN-macos-aarch64-dmg
          path: BibaVPN-macos-aarch64.dmg
          if-no-files-found: error
