# Manual: Actions → Desktop macOS → Run workflow. Also runs on push/PR when desktop paths change.
name: Desktop macOS

run-name: Desktop macOS · ${{ github.event_name == 'workflow_dispatch' && 'manual' || github.ref_name }}

on:
  workflow_dispatch:

  workflow_call:

  push:
    branches: [main, master]
    paths:
      - "bibavpn/**"
      - "!bibavpn/**/*.md"
      - "bibavpn-desktop/**"
      - "!bibavpn-desktop/**/*.md"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/desktop-macos.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "bibavpn/**"
      - "!bibavpn/**/*.md"
      - "bibavpn-desktop/**"
      - "!bibavpn-desktop/**/*.md"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/desktop-macos.yml"

concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: bibavpn-desktop/ui/package-lock.json

      - name: Install UI deps & build frontend
        run: npm ci && npm run build --prefix bibavpn-desktop/ui

      - name: Build bibavpn-desktop (release)
        run: cargo build -p bibavpn-desktop --release

      - name: Pack BibaVPN.app + DMG
        run: |
          set -euo pipefail
          APP_DIR="packaging/BibaVPN.app"
          BIN="$APP_DIR/Contents/MacOS/BibaVPN"
          mkdir -p "$(dirname "$BIN")" "$APP_DIR/Contents/Resources"
          cp target/release/bibavpn-desktop "$BIN"
          chmod +x "$BIN"
          cat > "$APP_DIR/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>BibaVPN</string>
            <key>CFBundleIdentifier</key>
            <string>dev.bibavpn.desktop</string>
            <key>CFBundleName</key>
            <string>BibaVPN</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
          STAGE="packaging/dmg_root"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP_DIR" "$STAGE/"
          ln -sf /Applications "$STAGE/Applications"
          rm -f BibaVPN-macos-aarch64.dmg
          hdiutil create -volname "BibaVPN" -srcfolder "$STAGE" -ov -format UDZO BibaVPN-macos-aarch64.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: BibaVPN-macos-aarch64-dmg
          path: BibaVPN-macos-aarch64.dmg
          if-no-files-found: error
