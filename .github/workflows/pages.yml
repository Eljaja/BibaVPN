# Deploy static landing page to GitHub Pages (https://eljaja.github.io/BibaVPN/).
# Runs only when docs or related design assets change — not on server/client/app commits.
#
# Repo settings → Pages → Build and deployment → Source: GitHub Actions.
name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "DESIGN.md"
      - "branding/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
