# Builds multi-arch Docker images for bibavpn-server and bibavpn-client and
# pushes them to Docker Hub.
#
# Images:
#   docker.io/eljaja/bibavpn-server
#   docker.io/eljaja/bibavpn-client
#
# Tagging:
#   - push to main                 → :latest, :main, :sha-<short>
#   - push tag vX.Y.Z              → :vX.Y.Z, :X.Y.Z, :X.Y, :X, :latest
#   - manual (workflow_dispatch)   → :latest, :manual-<run_id>
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  — e.g. eljaja
#   DOCKERHUB_TOKEN     — a Docker Hub Personal Access Token with Read+Write
#                         scope on the eljaja/bibavpn-server and
#                         eljaja/bibavpn-client repositories.
#
# Forks: this workflow only pushes when the event runs on the original
# repository (i.e. where the secrets exist). PRs from forks build only.
name: Docker images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            image: eljaja/bibavpn-server
            dockerfile: docker/Dockerfile.server
          - name: client
            image: eljaja/bibavpn-client
            dockerfile: docker/Dockerfile.client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Decide whether to push
        id: push
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.push.outputs.value == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=raw,value=manual-${{ github.run_id }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.push.outputs.value == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bibavpn-${{ matrix.name }}
          cache-to: type=gha,scope=bibavpn-${{ matrix.name }},mode=max
