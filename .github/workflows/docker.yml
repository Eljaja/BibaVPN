# Builds multi-arch Docker images for bibavpn-server and bibavpn-client and
# pushes them to Docker Hub.
#
# Images:
#   docker.io/eljaja/bibavpn-server
#   docker.io/eljaja/bibavpn-client
#
# Tagging:
#   - push to main                 → :latest, :main, :sha-<short>
#   - push tag vX.Y.Z              → :vX.Y.Z, :X.Y.Z, :X.Y, :X, :latest
#   - manual (workflow_dispatch)   → :latest, :manual-<run_id>
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  — e.g. eljaja
#   DOCKERHUB_TOKEN     — a Docker Hub Personal Access Token with Read+Write
#                         scope on the eljaja/bibavpn-server and
#                         eljaja/bibavpn-client repositories.
#
# Forks: this workflow only pushes when the event runs on the original
# repository (i.e. where the secrets exist). PRs from forks build only.
#
# Path gating: workflow skips docs-only / desktop-only / app-only commits.
# Per-image matrix: server and client images build independently when only one side changed.
name: Docker images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "bibavpn/**"
      - "!bibavpn/**/*.md"
      - "biba/**"
      - "!biba/**/*.md"
      - "docker/Dockerfile.server"
      - "docker/Dockerfile.client"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "docker-compose.yml"
      - "docker-compose.hub.yml"
      - "docker-compose.bibavpn-check.yml"
      - ".github/workflows/docker.yml"
  pull_request:
    branches:
      - main
    paths:
      - "bibavpn/**"
      - "!bibavpn/**/*.md"
      - "biba/**"
      - "!biba/**/*.md"
      - "docker/Dockerfile.server"
      - "docker/Dockerfile.client"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "docker-compose.yml"
      - "docker-compose.hub.yml"
      - "docker-compose.bibavpn-check.yml"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch' && !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'bibavpn/**'
              - '!bibavpn/**/*.md'
              - 'biba/**'
              - '!biba/**/*.md'
              - 'docker/Dockerfile.server'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'docker-compose.yml'
              - 'docker-compose.hub.yml'
              - 'docker-compose.bibavpn-check.yml'
              - '.github/workflows/docker.yml'
            client:
              - 'bibavpn/**'
              - '!bibavpn/**/*.md'
              - 'biba/**'
              - '!biba/**/*.md'
              - 'docker/Dockerfile.client'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'docker-compose.yml'
              - 'docker-compose.hub.yml'
              - 'docker-compose.bibavpn-check.yml'
              - '.github/workflows/docker.yml'

      - name: Plan matrix (which images to build)
        id: plan
        env:
          FILTER_SERVER: ${{ steps.filter.outputs.server }}
          FILTER_CLIENT: ${{ steps.filter.outputs.client }}
        run: |
          set -euo pipefail
          build_server=false
          build_client=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            build_server=true
            build_client=true
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            build_server=true
            build_client=true
          else
            if [ "${FILTER_SERVER:-}" = "true" ]; then build_server=true; fi
            if [ "${FILTER_CLIENT:-}" = "true" ]; then build_client=true; fi
          fi

          matrix='[]'
          if [ "$build_server" = true ]; then
            matrix=$(echo "$matrix" | jq -c '. + [{"name":"server","image":"eljaja/bibavpn-server","dockerfile":"docker/Dockerfile.server"}]')
          fi
          if [ "$build_client" = true ]; then
            matrix=$(echo "$matrix" | jq -c '. + [{"name":"client","image":"eljaja/bibavpn-client","dockerfile":"docker/Dockerfile.client"}]')
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Planned Docker matrix: $matrix"

  build-push:
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Decide whether to push
        id: push
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.push.outputs.value == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=raw,value=manual-${{ github.run_id }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.push.outputs.value == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bibavpn-${{ matrix.name }}
          cache-to: type=gha,scope=bibavpn-${{ matrix.name }},mode=max
