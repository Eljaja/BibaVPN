# Verify server and client Docker images build (no registry push).
name: Docker

on:
  push:
    branches: [main, master]
    paths:
      - "docker/**"
      - "bibavpn/**"
      - "bibavpn-jni/**"
      - "bibavpn-desktop/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main, master]
    paths:
      - "docker/**"
      - "bibavpn/**"
      - "bibavpn-jni/**"
      - "bibavpn-desktop/**"
      - "Cargo.toml"
      - "Cargo.lock"

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build bibavpn-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          push: false
          tags: bibavpn-server:ci

      - name: Build bibavpn-client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.client
          push: false
          tags: bibavpn-client:ci
