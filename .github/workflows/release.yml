# Builds macOS DMG, Windows ZIP, and Android APK (via reusable workflows), then uploads them to a GitHub Release.
#
# Triggers:
#   • Push a tag matching v* (e.g. git tag v0.2.1 && git push origin v0.2.1)
#   • Actions → Release → Run workflow: enter tag (e.g. v0.2.1); release is created at the current commit if the tag does not exist yet.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0). Created on this commit if missing."
        required: true
        type: string

  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    uses: ./.github/workflows/desktop-macos.yml
    secrets: inherit

  windows:
    uses: ./.github/workflows/desktop-windows.yml
    secrets: inherit

  linux:
    uses: ./.github/workflows/desktop-linux.yml
    secrets: inherit

  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  publish:
    needs: [macos, windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: BibaVPN-*
          path: dist
          merge-multiple: true

      # CI stages one arm64 debug APK as BibaVPN-android-debug.apk; fallbacks if layout changes.
      - name: Normalize APK filename
        run: |
          set -euo pipefail
          apk=""
          for name in \
            BibaVPN-android-debug.apk \
            app-arm64-debug.apk \
            app-arm64-v8a-debug.apk \
            app-universal-debug.apk \
            app-debug.apk \
            app-universal-release-unsigned.apk \
            app-universal-release.apk \
            app-release-unsigned.apk \
            app-release.apk
          do
            found="$(find dist -type f -name "$name" 2>/dev/null | head -n1 || true)"
            if [ -n "$found" ]; then
              apk="$found"
              break
            fi
          done
          if [ -z "${apk}" ]; then
            apk="$(find dist -type f -path '*/debug/*.apk' 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "${apk}" ]; then
            apk="$(find dist -type f -path '*/release/*.apk' 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "${apk}" ]; then
            apk="$(find dist -type f -name '*.apk' 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "${apk}" ]; then
            echo "::error::No .apk under dist" >&2
            find dist -type f 2>/dev/null || true
            exit 1
          fi
          echo "Using Android APK: ${apk}"
          target="dist/BibaVPN-android-debug.apk"
          if [ "$apk" != "$target" ]; then
            mv "$apk" "$target"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/BibaVPN-macos-aarch64.dmg
            dist/BibaVPN-windows-x64.zip
            dist/*.deb
            dist/*.AppImage
            dist/BibaVPN-android-debug.apk
