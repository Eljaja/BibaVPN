# Manual: Actions → Android → Run workflow. Also runs on push/PR when Android / JNI paths change.
name: Android

run-name: Android · ${{ github.event_name == 'workflow_dispatch' && 'manual' || github.ref_name }}

on:
  workflow_dispatch:

  push:
    branches: [main, master]
    paths:
      - "bibavpn/**"
      - "bibavpn-jni/**"
      - "android/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "bibavpn/**"
      - "bibavpn-jni/**"
      - "android/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools platforms;android-34 build-tools;34.0.0

      - name: Install NDK (Rust JNI)
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Rust toolchain (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: android-jni

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build JNI into jniLibs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 \
            -o android/app/src/main/jniLibs \
            build -p bibavpn-jni --release --locked

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BibaVPN-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
