# Manual: Actions → Android → Run workflow. Also runs on push/PR when Tauri Android / JNI paths change.
name: Android

run-name: Android · ${{ github.event_name == 'workflow_dispatch' && 'manual' || github.ref_name }}

on:
  workflow_dispatch:

  workflow_call:

  push:
    branches: [main, master]
    paths:
      - "bibavpn/**"
      - "!bibavpn/**/*.md"
      - "apps/bibavpn-jni/**"
      - "!apps/bibavpn-jni/**/*.md"
      - "apps/bibavpn-desktop/**"
      - "!apps/bibavpn-desktop/**/*.md"
      - "apps/scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "bibavpn/**"
      - "!bibavpn/**/*.md"
      - "apps/bibavpn-jni/**"
      - "!apps/bibavpn-jni/**/*.md"
      - "apps/bibavpn-desktop/**"
      - "!apps/bibavpn-desktop/**/*.md"
      - "apps/scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools platforms;android-34 build-tools;34.0.0

      - name: Install NDK (Rust JNI)
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Rust toolchain (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: android-jni

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install app dependencies
        working-directory: apps/bibavpn-desktop
        run: |
          npm ci
          npm ci --prefix ./ui

      - name: Initialize Tauri Android project
        run: |
          bash apps/scripts/tauri-android-init-local.sh
          bash apps/scripts/integrate-bibavpn-into-tauri-android.sh

      - name: Build JNI into Tauri jniLibs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 \
            -o apps/bibavpn-desktop/src-tauri/gen/android/app/src/main/jniLibs \
            build -p bibavpn-jni --release

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: apps/bibavpn-desktop/src-tauri/gen/android

      - name: Build Tauri Android APK
        working-directory: apps/bibavpn-desktop
        run: |
          npm run build --prefix ./ui
          attempt=1
          until [ "$attempt" -gt 3 ]; do
            npx tauri android build && exit 0
            attempt=$((attempt + 1))
            sleep 30
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BibaVPN-tauri-android
          path: apps/bibavpn-desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
