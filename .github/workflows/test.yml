# Manual: Actions → Tests → Run workflow.
#
# The build workflows compile the crates but never `cargo test`, and `cargo build`
# does not even type-check `#[cfg(test)]` code — so unit tests could break (or fail
# to compile) unnoticed. Each job runs the tests on the platform where that crate is
# already known to build: core crates on Linux (same as the Docker images),
# bibavpn-desktop on Windows (same as Desktop Windows).
#
# Jobs are path-gated: a protocol-only change does not start the Windows desktop
# test runner. Unrelated paths do not start this workflow at all.
name: Tests

run-name: Tests · ${{ github.event_name == 'workflow_dispatch' && 'manual' || github.ref_name }}

on:
  workflow_dispatch:

  workflow_call:

  push:
    branches: [main, master]
    paths:
      - "bibavpn/**"
      - "!bibavpn/**/*.md"
      - "biba/**"
      - "!biba/**/*.md"
      - "apps/bibavpn-desktop/**"
      - "!apps/bibavpn-desktop/**/*.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/test.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master]
    paths:
      - "bibavpn/**"
      - "!bibavpn/**/*.md"
      - "biba/**"
      - "!biba/**/*.md"
      - "apps/bibavpn-desktop/**"
      - "!apps/bibavpn-desktop/**/*.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/test.yml"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.plan.outputs.core }}
      desktop: ${{ steps.plan.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            core:
              - 'bibavpn/**'
              - '!bibavpn/**/*.md'
              - 'biba/**'
              - '!biba/**/*.md'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/test.yml'
            desktop:
              - 'apps/bibavpn-desktop/**'
              - '!apps/bibavpn-desktop/**/*.md'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/test.yml'

      - name: Plan which test jobs to run
        id: plan
        env:
          FILTER_CORE: ${{ steps.filter.outputs.core }}
          FILTER_DESKTOP: ${{ steps.filter.outputs.desktop }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "workflow_call" ]; then
            echo "core=true" >> "$GITHUB_OUTPUT"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "core=${FILTER_CORE:-false}" >> "$GITHUB_OUTPUT"
            echo "desktop=${FILTER_DESKTOP:-false}" >> "$GITHUB_OUTPUT"
          fi

  core:
    name: cargo test (bibavpn, biba)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Covers the library, both binaries (bibavpn-server / bibavpn-client) and
      # the integration tests under bibavpn/tests.
      - name: cargo test -p bibavpn -p biba
        run: cargo test -p bibavpn -p biba --locked

  desktop:
    name: cargo test (bibavpn-desktop)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      BIBA_BYPASS_DOMAINS_URL: ${{ secrets.BIBA_BYPASS_DOMAINS_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/bibavpn-desktop/ui/package-lock.json

      # tauri-build needs the frontend dist to exist, same as the Desktop Windows build.
      - name: Install UI deps & build frontend
        working-directory: apps/bibavpn-desktop/ui
        run: npm install --no-audit --no-fund && npm run build

      - name: cargo test -p bibavpn-desktop
        run: cargo test -p bibavpn-desktop --locked
