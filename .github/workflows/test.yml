# Manual: Actions → Tests → Run workflow.
#
# The build workflows compile the crates but never `cargo test`, and `cargo build`
# does not even type-check `#[cfg(test)]` code — so unit tests could break (or fail
# to compile) unnoticed. Each job runs the tests on the platform where that crate is
# already known to build: core crates on Linux (same as the Docker images),
# bibavpn-desktop on Windows (same as Desktop Windows).
#
# Jobs are path-gated: a protocol-only change does not start the Windows desktop
# test runner. Unrelated paths do not start this workflow at all.
name: Tests

run-name: Tests · ${{ github.event_name == 'workflow_dispatch' && 'manual' || github.ref_name }}

on:
  workflow_dispatch:

  workflow_call:

  push:
    branches: [main, master]
    paths:
      - "bibavpn/**"
      - "!bibavpn/**/*.md"
      - "biba/**"
      - "!biba/**/*.md"
      - "apps/bibavpn-desktop/**"
      - "!apps/bibavpn-desktop/**/*.md"
      - "apps/bibavpn-jni/**"
      - "!apps/bibavpn-jni/**/*.md"
      - "apps/bibavpn-ffi/**"
      - "!apps/bibavpn-ffi/**/*.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/test.yml"
      - ".github/agent/test-changes.sh"
      - ".github/agent/tests/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master]
    paths:
      - "bibavpn/**"
      - "!bibavpn/**/*.md"
      - "biba/**"
      - "!biba/**/*.md"
      - "apps/bibavpn-desktop/**"
      - "!apps/bibavpn-desktop/**/*.md"
      - "apps/bibavpn-jni/**"
      - "!apps/bibavpn-jni/**/*.md"
      - "apps/bibavpn-ffi/**"
      - "!apps/bibavpn-ffi/**/*.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/test.yml"
      - ".github/agent/test-changes.sh"
      - ".github/agent/tests/**"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate component selection and test log handling
        run: python3 .github/agent/tests/test_validation.py

  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.plan.outputs.core }}
      desktop: ${{ steps.plan.outputs.desktop }}
      mobile: ${{ steps.plan.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            core:
              - '{bibavpn/**,biba/**,Cargo.toml,Cargo.lock,rust-toolchain.toml,.github/workflows/test.yml}'
              - '!**/*.md'
            desktop:
              - '{apps/bibavpn-desktop/**,Cargo.toml,Cargo.lock,rust-toolchain.toml,.github/workflows/test.yml}'
              - '!**/*.md'
            mobile:
              - '{apps/bibavpn-jni/**,apps/bibavpn-ffi/**,Cargo.toml,Cargo.lock,rust-toolchain.toml,.github/workflows/test.yml}'
              - '!**/*.md'

      - name: Plan which test jobs to run
        id: plan
        env:
          FILTER_CORE: ${{ steps.filter.outputs.core }}
          FILTER_DESKTOP: ${{ steps.filter.outputs.desktop }}
          FILTER_MOBILE: ${{ steps.filter.outputs.mobile }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "workflow_call" ]; then
            echo "core=true" >> "$GITHUB_OUTPUT"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "core=${FILTER_CORE:-false}" >> "$GITHUB_OUTPUT"
            echo "desktop=${FILTER_DESKTOP:-false}" >> "$GITHUB_OUTPUT"
            echo "mobile=${FILTER_MOBILE:-false}" >> "$GITHUB_OUTPUT"
          fi

  core:
    name: cargo test (bibavpn, biba)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Covers the library, both binaries (bibavpn-server / bibavpn-client) and
      # the integration tests under bibavpn/tests.
      - name: cargo test -p bibavpn -p biba
        run: cargo test -p bibavpn -p biba --locked

      - name: Build local tunnel regression binaries
        run: cargo build -p bibavpn --bins --locked

      - name: Mux capacity and fallback session cleanup
        run: python3 bibavpn/tests/mux_capacity.py target/debug

  desktop:
    name: cargo test (bibavpn-desktop)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      BIBA_BYPASS_DOMAINS_URL: ${{ secrets.BIBA_BYPASS_DOMAINS_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/bibavpn-desktop/ui/package-lock.json

      # tauri-build needs the frontend dist to exist, same as the Desktop Windows build.
      - name: Install UI deps & build frontend
        working-directory: apps/bibavpn-desktop/ui
        run: npm install --no-audit --no-fund && npm run build

      - name: cargo test -p bibavpn-desktop
        run: cargo test -p bibavpn-desktop --locked

  mobile:
    name: cargo test (bibavpn-jni, bibavpn-ffi)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test -p bibavpn-jni -p bibavpn-ffi
        run: cargo test -p bibavpn-jni -p bibavpn-ffi --locked

  lint:
    name: fmt · clippy · audit
    # Unconditional, like agent-validation: the workflow-level `paths:` filters
    # above already scope this to Rust-relevant pushes/PRs, so it doesn't need
    # its own needs: changes gate.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        # 215 diffs across 40 files on main as of this PR. Kept non-blocking so
        # this gate can land without dragging a repo-wide reformat (and its
        # conflicts with every in-flight branch) along with it. Drop
        # continue-on-error once a dedicated `cargo fmt --all` PR has landed.
        continue-on-error: true
        run: cargo fmt --all --check

      - name: cargo clippy
        # ~120 pre-existing warnings across the workspace as of this PR; kept
        # non-blocking for now so the gate can land without a separate cleanup
        # pass. Drop continue-on-error once the backlog is cleared so clippy
        # actually gates merges.
        continue-on-error: true
        run: cargo clippy --workspace --all-targets

      - name: cargo audit
        # 6 open advisories on main as of this PR (rustls, rustls-webpki,
        # quick-xml via tauri build-dep). Non-blocking: advisories are published
        # upstream at any time, so a blocking gate turns CI red on unrelated
        # PRs. Report-only here; Dependabot (added in this PR) raises the bumps.
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit
