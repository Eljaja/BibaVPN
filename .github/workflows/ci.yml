# Core library: fmt, clippy, tests, JNI release build (Ubuntu).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy -p bibavpn -p bibavpn-jni --locked --all-targets

      - name: test bibavpn
        run: cargo test -p bibavpn --locked

      - name: build JNI (release)
        run: cargo build -p bibavpn-jni --release --locked
